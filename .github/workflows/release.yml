name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    # macos-13 is retired on GitHub-hosted runners. Build on a supported Intel
    # image, then use universal2 Python and validate both architectures.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # python.org's macOS installer is universal2. setup-python follows the
      # runner architecture, which would make this public artifact single-arch.
      - name: Install universal2 Python
        env:
          PYTHON_VERSION: 3.13.11
        run: |
          curl --fail --location --retry 3 --output python.pkg \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 --version
      - name: Build universal release
        env:
          PYTHON: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3
        run: ./scripts/build-release.sh
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FokusKeeper-macos-universal
          path: |
            dist/FokusKeeper.dmg
            dist/FokusKeeper.dmg.sha256
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FokusKeeper-macos-universal
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            FokusKeeper.dmg FokusKeeper.dmg.sha256 \
            --title "FokusKeeper ${GITHUB_REF_NAME}" \
            --generate-notes
